name: build-cnpg-timescaledb

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/cnpg-timescaledb/**"
      - ".github/workflows/build-cnpg-timescaledb.yaml"
  pull_request:
    paths:
      - ".github/cnpg-timescaledb/**"
      - ".github/workflows/build-cnpg-timescaledb.yaml"

env:
  MANIFEST: clusters/main/kubernetes/metrics/tracearr/app/helm-release.yaml
  BRANCH: automation/cnpg-timescaledb-roll
  IMAGE: ghcr.io/${{ github.repository_owner }}/cnpg-postgresql-timescale

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive image tag from Dockerfile
        id: tag
        run: |
          set -euo pipefail
          base="$(sed -nE 's|^FROM ghcr.io/cloudnative-pg/postgresql:([0-9.]+).*|\1|p' .github/cnpg-timescaledb/Dockerfile | head -1)"
          tsver="$(sed -nE 's|.*timescaledb-2-postgresql-[0-9]+=([0-9.]+)[*~].*|\1|p' .github/cnpg-timescaledb/Dockerfile | head -1)"
          if [ -z "$base" ] || [ -z "$tsver" ]; then
            echo "::error::Could not parse base or timescale version from Dockerfile"
            exit 1
          fi
          echo "tag=${base}-ts${tsver}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .github/cnpg-timescaledb
          # PR runs only validate the build.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Open or refresh the roll PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Pin by digest: a re-pushed (mutable) tag can otherwise resolve to a
          # stale cached image on the nodes and silently break WAL archiving.
          new="${IMAGE}:${TAG}@${DIGEST}"
          sed -i "s|ghcr.io/[^[:space:]]*/cnpg-postgresql-timescale:[^[:space:]]*|${new}|" "$MANIFEST"
          if git diff --quiet -- "$MANIFEST"; then
            echo "imageName already at ${new} - nothing to roll"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "chore(tracearr): roll cnpg timescaledb image to ${TAG}"
          git push --force origin "HEAD:${BRANCH}"

          body="$(mktemp)"
          {
            echo "Image \`${new}\` was built and pushed by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "This moves the CNPG cluster's \`imageName\` to \`${TAG}\`."
            echo
            echo "**:warning: If the TimescaleDB version changed, take a CNPG backup, then once the pods run the new image execute:**"
            echo
            echo '```sql'
            echo 'ALTER EXTENSION timescaledb UPDATE;'
            echo '```'
            echo
            echo "_Opened by CI with \`GITHUB_TOKEN\`: \`pull_request\` workflows (including the required \`Placeholder PR Tests\` check) do not run on it, so merge it with the admin bypass._"
          } > "$body"

          # create fails when the PR already exists; edit keeps re-runs idempotent.
          gh pr create --base main --head "$BRANCH" \
            --title "chore(tracearr): roll cnpg timescaledb image to ${TAG}" \
            --body-file "$body" ||
          gh pr edit "$BRANCH" \
            --title "chore(tracearr): roll cnpg timescaledb image to ${TAG}" \
            --body-file "$body"
