name: build-cnpg-timescaledb

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/cnpg-timescaledb/**"
      - ".github/workflows/build-cnpg-timescaledb.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/cnpg-timescaledb
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cnpg-postgresql-timescale:16.15-ts2.29
