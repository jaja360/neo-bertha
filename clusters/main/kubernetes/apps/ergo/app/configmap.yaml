apiVersion: v1
kind: ConfigMap
metadata:
  name: ergo-config
  namespace: ergo
data:
  ircd.yaml: |
    network:
        name: ErgoJael

    server:
        name: ergo.${DOMAIN_0}
        listeners:
            ":6667":
        unix-bind-mode: 0777

        tor-listeners:
            require-sasl: true
            vhost: "tor-network.onion"
            max-connections: 64
            throttle-duration: 10m
            max-connections-per-duration: 64

        sts:
            enabled: false
            duration: 1mo2d5m
            port: 6697
            preload: false

        websockets:
            allowed-origins:
                # - "https://ergo.chat"
                # - "https://*.ergo.chat"

        casemapping: "precis"
        enforce-utf8: true
        lookup-hostnames: false
        forward-confirm-hostnames: true
        check-ident: false

        coerce-ident: '~u'

        # You must hash the password with `ergo genpasswd`, then enter the hash here:
        #password: "$2a$04$0123456789abcdef0123456789abcdef0123456789abcdef01234"

        motd: /ircd/ergo.motd
        motd-formatting: true
        initial-notice: "*** Welcome to the ErgoJael IRC server"

        idle-timeouts:
            registration: 60s
            ping: 1m30s
            disconnect: 2m30s

        relaymsg:
            enabled: true
            separators: "/"
            available-to-chanops: true

        proxy-allowed-from:
            - localhost
            # - "192.168.1.1"
            # - "192.168.10.1/24"

        webirc:
            # one webirc block -- should correspond to one set of gateways
            -
                # SHA-256 fingerprint of the TLS certificate the gateway must use to connect
                # (comment this out to use passwords only)
                certfp: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"

                # password the gateway uses to connect, made with `ergo genpasswd`
                password: "$2a$04$abcdef0123456789abcdef0123456789abcdef0123456789abcde"

                # IPs/CIDRs that can use this webirc command
                # you should also add these addresses to the connection limits and throttling exemption lists
                hosts:
                    - localhost
                    # - "192.168.1.1"
                    # - "192.168.10.1/24"

                accept-hostname: false

        # maximum length of clients' sendQ in bytes
        max-sendq: 96k

        compatibility:
            force-trailing: true
            send-unprefixed-sasl: true
            allow-truncation: false

        ip-limits:
            count: true
            max-concurrent-connections: 4
            throttle: true
            window: 10m
            max-connections-per-window: 8
            cidr-len-ipv4: 32
            cidr-len-ipv6: 64
            exempted:
                - "localhost"
                # - "192.168.1.1"
                # - "2001:0db8::/32"

            custom-limits:

        ip-check-script:
            enabled: false
            command: "/usr/local/bin/check-ip-ban"
            args: []
            #socket: "/tmp/ergo_ip_check_sidecar"
            timeout: 9s
            kill-timeout: 1s
            max-concurrency: 64
            exempt-sasl: false

        ip-cloaking:
            enabled: true
            enabled-for-always-on: true
            netname: "irc"
            cidr-len-ipv4: 32
            cidr-len-ipv6: 64
            num-bits: 64

        secure-nets:
            # - "10.0.0.0/8"

        oper-throttle: 10s
        suppress-lusers: false
        additional-isupport:
            #"draft/FILEHOST": "https://example.com/filehost"
            #"draft/bazbat": "" # empty string means no value

    accounts:
        authentication-enabled: true
        registration:
            enabled: true
            allow-before-connect: true
            throttling:
                enabled: true
                duration: 10m
                max-attempts: 30
            bcrypt-cost: 4
            verify-timeout: "32h"

            email-verification:
                enabled: true
                sender: "${EMAIL_GMAIL}"
                require-tls: true
                helo-domain: "${DOMAIN_0}"
                mta:
                    server: smtp.gmail.com
                    port: 587
                    username: "${EMAIL_GMAIL}"
                    password: "${EMAIL_GMAIL_PASSWD}"
                    implicit-tls: false
                address-blacklist:
                #    - "*@mailinator.com"
                address-blacklist-syntax: "glob" # change to "regex" for regular expressions
                timeout: 60s
                password-reset:
                    enabled: false
                    cooldown: 1h
                    timeout: 1d

        login-throttling:
            enabled: true
            duration:  1m
            max-attempts: 3

        skip-server-password: false
        login-via-pass-command: true
        advertise-scram: true
        require-sasl:
            enabled: false
            exempted:
                - "localhost"

        nick-reservation:
            enabled: true
            additional-nick-limit: 0
            method: strict
            allow-custom-enforcement: false
            guest-nickname-format: "Guest-*"
            force-guest-format: true
            force-nick-equals-account: false
            forbid-anonymous-nick-changes: true

        multiclient:
            enabled: false
            allowed-by-default: true
            always-on: "disabled"
            auto-away: "opt-in"

        vhosts:
            enabled: true
            max-length: 64
            valid-regexp: '^[0-9A-Za-z.\-_/]+$'

        # see  /QUOTE HELP umodes  for more user modes
        default-user-modes: +i

        auth-script:
            enabled: false
            command: "/usr/local/bin/authenticate-irc-user"
            args: []
            autocreate: true
            timeout: 9s
            kill-timeout: 1s
            max-concurrency: 64

        oauth2:
            enabled: false
            autocreate: true
            auth-script: false
            introspection-url: "https://example.com/api/oidc/introspection"
            introspection-timeout: 10s
            client-id: "ergo"
            client-secret: "4TA0I7mJ3fUUcW05KJiODg"

        jwt-auth:
            enabled: false
            autocreate: true
            tokens:
                -
                    algorithm: "hmac" # either 'hmac', 'rsa', or 'eddsa' (ed25519)
                    key: "nANiZ1De4v6WnltCHN2H7Q"
                    account-claims: ["preferred_username"]

    channels:
        # +n is no-external-messages, +t is op-only-topic,
        # +C is no CTCPs (besides ACTION)
        # see  /QUOTE HELP cmodes  for more channel modes
        default-modes: +ntC
        max-channels-per-client: 100
        operator-only-creation: true
        registration:
            enabled: true
            operator-only: true
            max-channels-per-account: 15
        list-delay: 0s
        invite-expiration: 24h
        auto-join:
            - "#lounge"

    oper-classes:
        # chat moderator: can ban/unban users from the server, join channels,
        "chat-moderator":
            title: Chat Moderator
            capabilities:
                - "kill"      # disconnect user sessions
                - "ban"       # ban IPs, CIDRs, NUH masks, and suspend accounts (UBAN / DLINE / KLINE)
                - "nofakelag" # exempted from "fakelag" restrictions on rate of message sending
                - "relaymsg"  # use RELAYMSG in any channel (see the `relaymsg` config block)
                - "vhosts"    # add and remove vhosts from users
                - "sajoin"    # join arbitrary channels, including private channels
                - "samode"    # modify arbitrary channel and user modes
                - "snomasks"  # subscribe to arbitrary server notice masks
                - "roleplay"  # use the (deprecated) roleplay commands in any channel

        # server admin: has full control of the ircd, including nickname and
        # channel registrations
        "server-admin":
            title: Server Admin
            extends: "chat-moderator"
            capabilities:
                - "rehash"       # rehash the server, i.e. reload the config at runtime
                - "accreg"       # modify arbitrary account registrations
                - "chanreg"      # modify arbitrary channel registrations
                - "history"      # modify or delete history messages
                - "defcon"       # use the DEFCON command (restrict server capabilities)
                - "massmessage"  # message all users on the server
                - "metadata"     # modify arbitrary metadata on channels and users

    opers:
        admin:
            class: "server-admin"
            hidden: true
            whois-line: is the server administrator
            password: "${ERGO_OPER_PASSWD_HASH}"

    logging:
        -
            method: stderr
            # useful types include:
            #   *               everything (usually used with excluding some types below)
            #   server          server startup, rehash, and shutdown events
            #   accounts        account registration and authentication
            #   channels        channel creation and operations
            #   opers           oper actions, authentication, etc
            #   services        actions related to NickServ, ChanServ, etc.
            #   internal        unexpected runtime behavior, including potential bugs
            #   userinput       raw lines sent by users
            #   useroutput      raw lines sent to users
            type: "* -userinput -useroutput"
            level: info

    debug:
        recover-from-errors: true

    lock-file: "ircd.lock"

    datastore:
        path: /ircd/ircd.db
        autoupgrade: true

        mysql:
            enabled: false
            host: "localhost"
            port: 3306
            user: "ergo"
            password: "hunter2"
            history-database: "ergo_history"
            timeout: 3s
            max-conns: 4

        postgresql:
            enabled: false
            host: "localhost"
            port: 5432
            ssl-mode: "disable" # options: disable, require, verify-ca, verify-full
            user: "ergo"
            password: "hunter2"
            history-database: "ergo_history"
            timeout: 3s
            max-conns: 4

        sqlite:
            enabled: false
            database-path: "ergo_history.db"
            busy-timeout: 5s
            max-conns: 1

    languages:
        # whether to load languages
        enabled: true
        default: en
        path: /ircd-bin/languages

    limits:
        nicklen: 32
        identlen: 20
        realnamelen: 150
        channellen: 64
        awaylen: 390
        kicklen: 390
        topiclen: 390
        monitor-entries: 100
        whowas-entries: 100
        chan-list-modes: 100
        registration-messages: 1024
        multiline:
            max-bytes: 4096 # 0 means disabled
            max-lines: 100  # 0 means no limit

    fakelag:
        enabled: true
        window: 1s
        burst-limit: 5
        messages-per-window: 2
        cooldown: 2s

        command-budgets:
            "CHATHISTORY": 16
            "MARKREAD":    16
            "MONITOR":     1
            "WHO":         4
            "WEBPUSH":     1

    roleplay:
        enabled: false
        require-oper: false
        require-chanops: false
        add-suffix: true

    extjwt:
        # services:
        #     "jitsi":
        #         expiration: 30s
        #         algorithm: "hmac"
        #         key: "qmamLKDuOzIzlO8XqsGGewei_At11lewh6jtKfSTbkg"

    authtoken:
        enabled: false
        verification-ip-whitelist:
            - "localhost"
        #services:
        #   "FILEHOST":
        #       expiration: 5m
        #       url: "https://example.com/filehost"
        #       algorithm: "eddsa"
        #       key: "-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIHfpO1x835o9NIQA1kBkN7/Myd6wqE/m/EYJUHBC18hW\n-----END PRIVATE KEY-----"

    history:
        enabled: false
        channel-length: 2048
        client-length: 256
        autoresize-window: 3d
        autoreplay-on-join: 0
        chathistory-maxmessages: 0
        znc-maxmessages: 2048
        restrictions:
            expire-time: 1w
            query-cutoff: 'none'
            grace-period: 1h
        persistent:
            enabled: false
            unregistered-channels: false
            registered-channels: "opt-out"
            direct-messages: "opt-out"
        retention:
            allow-individual-delete: false
            enable-account-indexing: false
        tagmsg-storage:
            default: false
            whitelist:
                - "+draft/react"
                - "+react"
            #blacklist:
            #    - "+draft/typing"
            #    - "typing"

    allow-environment-overrides: true

    metadata:
        enabled: true
        operator-only-modification: false
        max-subs: 100
        max-keys: 100
        client-throttle:
            enabled: true
            duration: 2m
            max-attempts: 10

    webpush:
        enabled: false
        timeout: 10s
        delay: 0s
        max-subscriptions: 4
        expiration: 14d

    api:
        enabled: false
        listener: "127.0.0.1:8089"
        bearer-tokens:
            - "example"
  ergo.motd: |
    Welcome to ErgoJael - this network is operated by jaja27
