apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ergo
  namespace: flux-system
spec:
  interval: 10m
  # Gateway API CRDs / Gateway must exist before the TLSRoute is applied
  dependsOn:
    - name: envoy-gateway-config
  path: clusters/main/kubernetes/apps/ergo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
