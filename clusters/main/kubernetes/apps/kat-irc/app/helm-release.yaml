apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kat-irc
  namespace: kat-irc
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/jaja360/kat-irc
      pullPolicy: IfNotPresent
      tag: "0.1.0"
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    service:
      main:
        enabled: true
        type: LoadBalancer
        ports:
          main:
            enabled: true
            port: 8080
            protocol: http
            targetPort: 8080
    persistence:
      data:
        enabled: true
        type: pvc
        size: 1Gi
        mountPath: /data
        targetSelectAll: true
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: data
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 128Mi
    workload:
      main:
        type: Deployment
        replicas: 1
        strategy: Recreate
        podSpec:
          automountServiceAccountToken: false
          containers:
            main:
              args:
                - serve
                - -config
                - /data/config.json
              probes:
                liveness:
                  enabled: true
                  type: http
                  port: 8080
                  path: /healthz
                readiness:
                  enabled: true
                  type: http
                  port: 8080
                  path: /readyz
                startup:
                  enabled: true
                  type: http
                  port: 8080
                  path: /healthz
