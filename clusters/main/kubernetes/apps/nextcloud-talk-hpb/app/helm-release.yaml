apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-talk-hpb
  namespace: nextcloud-talk-hpb
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: nextcloud/aio-talk
      pullPolicy: IfNotPresent
      tag: 20260916_075031@sha256:f0b32ce140d1f2863dbaf84b3e64a2400df61ce959a3478cc41304887252ea18
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                NC_DOMAIN: "nextcloud.${DOMAIN_0}"
                TALK_HOST: "talk-hpb.${DOMAIN_0}"
                TALK_PORT: "3478"
                TURN_DOMAIN: "${NEXTCLOUD_TALK_HPB_IP}"
                TURN_SECRET: ${TALK_HPB_TURN_SECRET}
                SIGNALING_SECRET: ${TALK_HPB_SIGNALING_SECRET}
                INTERNAL_SECRET: ${TALK_HPB_INTERNAL_SECRET}

                # Tune these if calls look blurry: bytes/s, per stream and per screen share.
                # TALK_MAX_STREAM_BITRATE: "1048576"
                # TALK_MAX_SCREEN_BITRATE: "2097152"
              resources:
                limits:
                  cpu: "4"
                  memory: 2Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              probes:
                liveness:
                  type: http
                  path: /api/v1/welcome
                  port: 8081
                readiness:
                  type: http
                  path: /api/v1/welcome
                  port: 8081
                startup:
                  type: http
                  path: /api/v1/welcome
                  port: 8081
    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          main:
            enabled: true
            port: 8081
            protocol: http
            targetPort: 8081
      turn:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${NEXTCLOUD_TALK_HPB_IP}
        integrations:
          metallb:
            enabled: true
        ports:
          turn-udp:
            enabled: true
            port: 3478
            protocol: udp
            targetPort: 3478
          turn-tcp:
            enabled: true
            port: 3478
            protocol: tcp
            targetPort: 3478
    ingress:
      main:
        enabled: true
        annotations:
          # websocket sessions are long lived; the nginx default of 60s would
          # drop quiet connections
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: "talk-hpb.${DOMAIN_0}"
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    persistence:
      conf:
        enabled: true
        type: emptyDir
        mountPath: /conf
      turn:
        enabled: true
        type: emptyDir
        mountPath: /var/lib/turn
