apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-talk-hpb
  namespace: nextcloud-talk-hpb
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: nextcloud/aio-talk
      pullPolicy: IfNotPresent
      tag: 20260916_075031@sha256:f0b32ce140d1f2863dbaf84b3e64a2400df61ce959a3478cc41304887252ea18
    workload:
      main:
        podSpec:
          hostNetwork: true
          containers:
            main:
              # /start.sh regenerates /conf/janus.jcfg on every start: it strips the
              # sample's nat block and writes a TURN-only one, so Janus never learns
              # the public address and can only offer its LAN IP as an ICE candidate.
              # Remote participants therefore have nothing routable to connect to.
              # Overriding args (the image CMD) is the only hook that runs *after*
              # generation, so we add a STUN server there, letting Janus discover its
              # public mapping itself. No router changes needed.
              # If a remote call still fails, the fallback is a bounded media port
              # range (rtp_port_range) plus nat_1_1_mapping and a router forward.
              args:
                - /bin/bash
                - -c
                - |
                  set -u
                  CFG=/conf/janus.jcfg
                  MEDIA_RANGE=20000-20300
                  STUN_HOST=stun.l.google.com
                  STUN_PORT=19302

                  # Resolve STUN to an IPv4 literal: this node has no IPv6 route, and a hostname
                  # could make Janus pick an AAAA it can never reach.
                  STUN_IP=""
                  for r in 1.1.1.1 8.8.8.8 on; do
                      if [ "$$r" = on ]; then
                          STUN_IP=$$(dig +short A "$$STUN_HOST" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$$' | head -1)
                      else
                          STUN_IP=$$(dig +short A "$$STUN_HOST" "@$$r" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$$' | head -1)
                      fi
                      [ -n "$$STUN_IP" ] && break
                  done

                  # Public IP, used for the 1:1 mapping. HTTP only: the DNS based "whoami"
                  # services return rewritten answers on this network.
                  PUBLIC_IP=""
                  for u in https://api.ipify.org https://ifconfig.me/ip https://icanhazip.com; do
                      ip=$$(wget -q -T 8 -O - "$$u" 2>/dev/null | tr -d ' \r\n')
                      case "$$ip" in ''|*[!0-9.]*) continue;; esac
                      PUBLIC_IP="$$ip"; break
                  done
                  PUBLIC_OK=yes
                  case "$$PUBLIC_IP" in
                      '') PUBLIC_OK=no;;
                      10.*|127.*|192.168.*|169.254.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|100.6[4-9].*|100.[7-9][0-9].*)
                          PUBLIC_OK=no; echo "WARN: detected $$PUBLIC_IP which is private/CGNAT; not adding nat_1_1_mapping";;
                  esac

                  # nat block: STUN plus a 1:1 mapping. keep_private_host keeps the LAN address
                  # as a candidate as well, so LAN clients still connect directly (no hairpin).
                  if [ -n "$$STUN_IP" ]; then
                      if grep -q '^[[:space:]]*stun_server' "$$CFG"; then
                          sed -i "s|^[[:space:]]*stun_server = .*|\tstun_server = \"$$STUN_IP\"|" "$$CFG"
                      else
                          sed -i "s|^nat: {|nat: {\n\tstun_server = \"$$STUN_IP\"\n\tstun_port = $$STUN_PORT|" "$$CFG"
                      fi
                      sed -i "s|^[[:space:]]*stun_port = .*|\tstun_port = $$STUN_PORT|" "$$CFG"
                  fi
                  if [ "$$PUBLIC_OK" = yes ]; then
                      if grep -q '^[[:space:]]*nat_1_1_mapping' "$$CFG"; then
                          sed -i "s|^[[:space:]]*nat_1_1_mapping = .*|\tnat_1_1_mapping = \"$$PUBLIC_IP\"|" "$$CFG"
                      else
                          sed -i "s|^nat: {|nat: {\n\tnat_1_1_mapping = \"$$PUBLIC_IP\"|" "$$CFG"
                      fi
                      grep -q 'keep_private_host' "$$CFG" || sed -i "s|^nat: {|nat: {\n\tkeep_private_host = true|" "$$CFG"
                  fi

                  # media block: confine RTP/ICE ports to the range forwarded on the router, so
                  # the mapped candidates always point at a port that actually reaches this host.
                  if grep -q 'rtp_port_range' "$$CFG"; then
                      sed -i "s|^[[:space:]]*#*rtp_port_range = .*|\trtp_port_range = \"$$MEDIA_RANGE\"|" "$$CFG"
                  else
                      sed -i "s|^media: {|media: {\n\trtp_port_range = \"$$MEDIA_RANGE\"|" "$$CFG"
                  fi

                  echo "janus nat: stun=$${STUN_IP:-none}:$$STUN_PORT mapping=$${PUBLIC_IP:-none} rtp_ports=$$MEDIA_RANGE"
                  exec dinit --system --container nats-server eturnal janus signaling
              env:
                NC_DOMAIN: "nextcloud.${DOMAIN_0}"
                TALK_HOST: "talk-hpb.${DOMAIN_0}"
                TALK_PORT: "3478"
                TURN_DOMAIN: "${NEXTCLOUD_TALK_HPB_IP}"
                TURN_SECRET: ${TALK_HPB_TURN_SECRET}
                SIGNALING_SECRET: ${TALK_HPB_SIGNALING_SECRET}
                INTERNAL_SECRET: ${TALK_HPB_INTERNAL_SECRET}

                # Tune these if calls look blurry: bytes/s, per stream and per screen share.
                # TALK_MAX_STREAM_BITRATE: "1048576"
                # TALK_MAX_SCREEN_BITRATE: "2097152"
              resources:
                limits:
                  cpu: "4"
                  memory: 2Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              probes:
                liveness:
                  type: http
                  path: /api/v1/welcome
                  port: 8081
                readiness:
                  type: http
                  path: /api/v1/welcome
                  port: 8081
                startup:
                  type: http
                  path: /api/v1/welcome
                  port: 8081
    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          main:
            enabled: true
            port: 8081
            protocol: http
            targetPort: 8081
      turn:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${NEXTCLOUD_TALK_HPB_IP}
        integrations:
          metallb:
            enabled: true
        ports:
          turn-udp:
            enabled: true
            port: 3478
            protocol: udp
            targetPort: 3478
          turn-tcp:
            enabled: true
            port: 3478
            protocol: tcp
            targetPort: 3478
    ingress:
      main:
        enabled: true
        annotations:
          # websocket sessions are long lived; the nginx default of 60s would
          # drop quiet connections
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: "talk-hpb.${DOMAIN_0}"
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    persistence:
      conf:
        enabled: true
        type: emptyDir
        mountPath: /conf
      turn:
        enabled: true
        type: emptyDir
        mountPath: /var/lib/turn
