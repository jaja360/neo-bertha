apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 46.8.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    persistence:
      config:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: config
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      html:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: html
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      data:
        enabled: true
        type: nfs
        path: ${NFS_NEXTCLOUD_PATH}
        server: ${NFS_SERVER}
    cnpg:
      main:
        password: ${CNPG_PASSWD}
        hibernate: false
        mode: recovery
        cluster:
          instances: ${NUMBER_OF_NODES}
          singleNode: ${SINGLE_NODE}
          postgresql:
            max_connections: "250"
        backups:
          enabled: true
          credentials: backblaze
        recovery:
          enabled: true
          credentials: backblaze
    redis:
      password: ${CNPG_PASSWD}
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  ALLOW_EMPTY_PASSWORD: "no"
                  VALKEY_PASSWORD: ${CNPG_PASSWD}
    service:
      main:
        type: LoadBalancer
    ingress:
      main:
        enabled: true
        hosts:
          - host: "nextcloud.${DOMAIN_0}"
            paths:
            - path: /
              pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Misc
            name: "Nextcloud"
            widget:
              enabled: false
              key: ${NEXTCLOUD_NC_TOKEN}
              username: ${NEXTCLOUD_ADMIN_USER}
              password: ${NEXTCLOUD_ADMIN_PASSWD}

    nextcloud:
      credentials:
        initialAdminUser: ${NEXTCLOUD_ADMIN_USER}
        initialAdminPassword: ${NEXTCLOUD_ADMIN_PASSWD}
      general:
        accessIP: ${NGINX_EXTERNAL_IP}
        default_phone_region: CA
      previews:
        providers:
          - PNG
          - JPEG
          - BMP
          - GIF
          - Krita
          - MarkDown
          - MP3
          - OpenDocument
          - TXT
          - XBitmap
      clamav:
        enabled: false
      collabora:
        enabled: true
        username: ${NEXTCLOUD_ADMIN_USER}
        password: ${NEXTCLOUD_ADMIN_PASSWD}
        dictionaries:
          - en_US
          - fr_CA
