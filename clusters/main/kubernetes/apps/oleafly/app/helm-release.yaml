---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oleafly
  namespace: oleafly
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.2.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/oleafly/oleafly-server
      tag: 0.1.1
    credentials:
      backblaze:
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    service:
      main:
        type: LoadBalancer
        ports:
          main:
            port: 8080
    ingress:
      main:
        enabled: true
        annotations:
          nginx.ingress.kubernetes.io/proxy-body-size: "200m"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: "oleafly.${DOMAIN_0}"
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    persistence:
      data:
        enabled: true
        mountPath: /data
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: data
            type: restic
            credentials: backblaze
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                OLEAFLY_PUBLIC_URL: https://oleafly.${DOMAIN_0}
                OLEAFLY_BEHIND_PROXY: "true"
                OLEAFLY_OPEN_SIGNUP: "true"
                OLEAFLY_ACCOUNT_STORAGE_MB: "5120"
                OLEAFLY_MAX_PROJECTS_PER_ACCOUNT: "200"
                OLEAFLY_UPLOADS_PER_HOUR: "1000"
                OLEAFLY_SMTP_URL: smtps://${EMAIL_GMAIL}:${EMAIL_GMAIL_PASSWD}@smtp.gmail.com:465
                OLEAFLY_MAIL_FROM: ${EMAIL_GMAIL}
                OLEAFLY_OIDC_AUTHELIA_ISSUER: https://auth.${DOMAIN_0}
                OLEAFLY_OIDC_AUTHELIA_CLIENT_ID: oleafly
                OLEAFLY_OIDC_AUTHELIA_CLIENT_SECRET: ${OLEAFLY_OIDC_CLIENT_SECRET}
                OLEAFLY_OIDC_AUTHELIA_TRUST_EMAIL: "true"
                OLEAFLY_OIDC_AUTHELIA_LABEL: Authelia
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /healthz
                readiness:
                  enabled: true
                  type: http
                  path: /healthz
                startup:
                  enabled: true
                  type: http
                  path: /healthz
