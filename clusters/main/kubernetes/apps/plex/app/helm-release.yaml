apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 15m
  chart:
    spec:
      chart: plex
      version: 22.10.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 30m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    persistence:
      medias:
        enabled: true
        type: nfs
        mountPath: /medias
        path: ${NFS_MEDIAS_PATH}
        server: ${NFS_SERVER}
      config:
        targetSelectAll: true
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: config
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      metadata:
        enabled: true
        type: pvc
        mountPath: "/config/Library/Application Support/Plex Media Server/Metadata"
      media:
        enabled: true
        type: pvc
        mountPath: "/config/Library/Application Support/Plex Media Server/Media"
      cache:
        enabled: true
        type: pvc
        mountPath: "/config/Library/Application Support/Plex Media Server/Cache"
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${PLEX_IP}
        integrations:
          metallb:
            enabled: true
    ingress:
      main:
        enabled: true
        hosts:
          - host: "plex.${DOMAIN_0}"
            paths:
            - path: /
              pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Misc
            name: "Plex"
            widget:
              enabled: true
              custom:
                key: ${PLEX_TOKEN}
    plex:
      serverIP: ${PLEX_IP}
    # Temporarily disabled while Talos is upgraded without NVIDIA extensions.
    # resources:
    #   limits:
    #     nvidia.com/gpu: 1
    workload:
      main:
        podSpec:
          containers:
            main:
              resources:
                limits:
                  cpu: 24000m
                  memory: 8Gi
                requests:
                  cpu: 4000m
                  memory: 1Gi
