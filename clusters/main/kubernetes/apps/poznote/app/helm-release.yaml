apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: poznote
  namespace: poznote
spec:
  interval: 15m
  chart:
    spec:
      chart: poznote
      version: 0.3.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: ${BACKBLAZE_ID}
        bucket: ${BACKBLAZE_BUCKET}
        encrKey: ${BACKBLAZE_ENCR_KEY}
        secretKey: ${BACKBLAZE_KEY}
        url: ${BACKBLAZE_URL}
    persistence:
      data:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        targetSelector:
          main:
            mcp: {}
        volsync:
          - name: data
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
    service:
      main:
        type: LoadBalancer
        ports:
          mcp:
            enabled: true
            port: 8045
    mcpImage:
      repository: ghcr.io/timothepoznanski/poznote-mcp
      tag: "6"
      pullPolicy: IfNotPresent
    ingress:
      main:
        enabled: true
        hosts:
          - host: poznote.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_0}"
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Misc
            name: "Poznote"
            description: "Self-hosted notes and knowledge base"
            icon: "https://raw.githubusercontent.com/timothepoznanski/poznote/main/images/poznote.svg"
            widget:
              enabled: false
    # MCP server sidecar: shares the data volume to read .mcp_token and talks
    # to the Poznote REST API on localhost. Reachable on the LoadBalancer at :8045.
    workload:
      main:
        podSpec:
          containers:
            mcp:
              enabled: true
              imageSelector: mcpImage
              env:
                POZNOTE_API_URL: http://127.0.0.1:8080/api/v1
                POZNOTE_USER_ID: "1"
                POZNOTE_DEBUG: "false"
                MCP_HOST: "0.0.0.0"
                POZNOTE_MCP_AUTH_TOKEN: ${POZNOTE_MCP_AUTH_TOKEN}
              ports:
                mcp:
                  enabled: true
                  port: 8045
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
                readOnlyRootFilesystem: false
              resources:
                excludeExtra: true
