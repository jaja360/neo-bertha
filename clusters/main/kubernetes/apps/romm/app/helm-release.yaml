apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
  namespace: romm
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: rommapp/romm
      pullPolicy: IfNotPresent
      tag: 5.2.0
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: ${BACKBLAZE_ID}
        bucket: ${BACKBLAZE_BUCKET}
        encrKey: ${BACKBLAZE_ENCR_KEY}
        secretKey: ${BACKBLAZE_KEY}
        url: ${BACKBLAZE_URL}
    cnpg:
      main:
        enabled: true
        type: postgres
        user: romm
        database: romm
        password: ${CNPG_PASSWD}
        hibernate: false
        mode: standalone
        cluster:
          instances: ${NUMBER_OF_NODES}
          singleNode: ${SINGLE_NODE}
          imageName: ghcr.io/cloudnative-pg/postgresql:16
        backups:
          enabled: true
          credentials: backblaze
        recovery:
          enabled: false
          credentials: backblaze
    secret:
      cnpg-main-user:
        enabled: false
        data:
          username: ""
          password: ""
    persistence:
      config:
        enabled: true
        mountPath: /romm/config
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: config
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      resources:
        enabled: true
        mountPath: /romm/resources
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: resources
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      assets:
        enabled: true
        mountPath: /romm/assets
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: assets
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      redis-data:
        enabled: true
        mountPath: /redis-data
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: redis-data
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      library:
        enabled: true
        type: nfs
        mountPath: /romm/library
        path: ${NFS_MEDIAS_PATH}
        server: ${NFS_SERVER}
    service:
      main:
        enabled: true
        type: LoadBalancer
        ports:
          main:
            enabled: true
            port: 8080
    ingress:
      main:
        enabled: true
        hosts:
          - host: romm.${DOMAIN_0}
            paths:
            - path: /
              pathType: Prefix
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_0}"
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Apps
            name: "RomM"
            description: "ROM library manager and player"
            icon: "https://raw.githubusercontent.com/rommapp/romm/master/.github/resources/isotipo.png"
            widget:
              enabled: false
    securityContext:
      container:
        readOnlyRootFilesystem: false
    workload:
      main:
        podSpec:
          enableServiceLinks: false
          containers:
            main:
              env:
                ROMM_DB_DRIVER: postgresql
                DB_HOST: romm-app-template-cnpg-main-rw
                DB_PORT: "5432"
                DB_NAME: romm
                DB_USER:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: username
                DB_PASSWD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                ROMM_BASE_URL: "https://romm.${DOMAIN_0}"
                ROMM_SESSION_SECURE_COOKIE: "true"
                ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
