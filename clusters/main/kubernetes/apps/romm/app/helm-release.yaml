apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
  namespace: romm
spec:
  interval: 15m
  chart:
    spec:
      chart: romm
      version: 19.8.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: ${BACKBLAZE_ID}
        bucket: ${BACKBLAZE_BUCKET}
        encrKey: ${BACKBLAZE_ENCR_KEY}
        secretKey: ${BACKBLAZE_KEY}
        url: ${BACKBLAZE_URL}
    cnpg:
      main:
        enabled: true
        user: romm
        database: romm
        password: ${CNPG_PASSWD}
        hibernate: false
        mode: standalone
        cluster:
          instances: ${NUMBER_OF_NODES}
          singleNode: ${SINGLE_NODE}
        backups:
          enabled: true
          credentials: backblaze
        recovery:
          enabled: false
          credentials: backblaze
    persistence:
      config:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: config
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      resources:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: resources
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      assets:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: assets
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
      library:
        type: nfs
        path: ${NFS_MEDIAS_PATH}
        server: ${NFS_SERVER}
    service:
      main:
        type: LoadBalancer
    ingress:
      main:
        enabled: true
        hosts:
          - host: romm.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_0}"
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Apps
            name: "RomM"
            description: "ROM library manager and player"
            icon: "https://raw.githubusercontent.com/rommapp/romm/master/.github/resources/isotipo.png"
            widget:
              enabled: false

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                ROMM_BASE_URL: "https://romm.${DOMAIN_0}"
                ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
                SCREENSCRAPER_USER: ${SCREENSCRAPER_USER}
                SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD}
                IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
                IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
                RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY}
                STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY}
                HASHEOUS_API_ENABLED: true
                PLAYMATCH_API_ENABLED: true
                HLTB_API_ENABLED: true
                FLASHPOINT_API_ENABLED: true
