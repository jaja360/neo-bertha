# yaml-language-server: $schema=https://www.schemastore.org/any.json
# Uploads + WebSocket (8443): Soju's ListenerSet terminates TLS with its managed certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: soju
  namespace: soju
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: soju-https
      sectionName: https
  hostnames:
    - "irc.${DOMAIN_0}"
  rules:
    - backendRefs:
        - name: soju-app-template-http
          port: 8080
