# yaml-language-server: $schema=https://www.schemastore.org/any.json
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: soju-https
  namespace: soju
  annotations:
    cert-manager.io/cluster-issuer: domain-0-le-prod
    cert-manager.io/private-key-rotation-policy: Always
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: envoy-gateway
  listeners:
    - name: https
      hostname: "irc.${DOMAIN_0}"
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: soju-https-tls
