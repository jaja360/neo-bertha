apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: soju
  namespace: flux-system
spec:
  interval: 10m
  # Gateway API CRDs (TLSRoute/HTTPRoute) and the Gateway must exist first
  dependsOn:
    - name: envoy-gateway-config
  path: clusters/main/kubernetes/apps/soju/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
