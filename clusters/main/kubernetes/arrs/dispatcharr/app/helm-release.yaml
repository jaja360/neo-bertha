apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dispatcharr
  namespace: dispatcharr
spec:
  interval: 15m
  chart:
    spec:
      chart: dispatcharr
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    addons:
      gluetun:
        enabled: true
        container:
          resources:
            limits:
              truecharts.org/tun: 1
          env:
            FIREWALL: "on"
            FIREWALL_OUTBOUND_SUBNETS: "192.168.0.0/24"
            VPN_TYPE: wireguard
            VPN_SERVICE_PROVIDER: custom
            WIREGUARD_ENDPOINT_PORT: ${WG_ENDPOINT_PORT}
            WIREGUARD_ENDPOINT_IP: ${WG_DISPATCHARR_ENDPOINT_IP}
            WIREGUARD_ADDRESSES: ${WG_DISPATCHARR_ADDRESSES}
            WIREGUARD_PRIVATE_KEY: ${WG_DISPATCHARR_PRIVATE_KEY}
            WIREGUARD_PUBLIC_KEY: ${WG_DISPATCHARR_PUBLIC_KEY}
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    persistence:
      data:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: data
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
    service:
      main:
        type: LoadBalancer
    ingress:
      main:
        enabled: true
        hosts:
          - host: "dispatcharr.${DOMAIN_0}"
            paths:
            - path: /
              pathType: Prefix
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_0}"
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Arrs
            name: "dispatcharr"
            widget:
              enabled: true
              enableActiveStreams: true
              username: "${DISPATCHARR_USERNAME}"
              password: "${DISPATCHARR_PASSWORD}"
