apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: seerr
spec:
  interval: 15m
  chart:
    spec:
      chart: seerr
      version: 16.6.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      backblaze:
        name: backblaze
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    persistence:
      config:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: config
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
    service:
      main:
        type: LoadBalancer
    ingress:
      main:
        enabled: true
        hosts:
          - host: "seerr.${DOMAIN_0}"
            paths:
            - path: /
              pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Arrs
            name: "Seerr"
            widget:
              enabled: true
              custom:
                key: ${SEERR_APIKEY}
    cnpg:
      main:
        enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                DB_TYPE: sqlite
                DB_HOST: ""
                DB_PASS: ""
                DB_USER: ""
                DB_NAME: ""
                DB_PORT: ""
