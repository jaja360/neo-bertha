apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stash
  namespace: stash
spec:
  interval: 15m
  chart:
    spec:
      chart: stash
      version: 21.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: false
        privileged: false
      pod:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    credentials:
      backblaze:
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    persistence:
      config:
        annotations:
          volsync.backube/use-copy-trigger: "true"
        volsync:
          - name: config
            type: restic
            credentials: backblaze
            cleanupCachePVC: true
            dest:
              enabled: ${RESTORE_PVCS}
            src:
              enabled: true
              trigger:
                schedule: 0 9 * * *
        subPath: config
        mountPath: /config
      metadata:
        existingClaim: stash-cache
        subPath: metadata
        mountPath: /metadata
      cache:
        subPath: cache
        mountPath: /cache
      generated:
        existingClaim: stash-cache
        subPath: generated
        mountPath: /generated
      blobs:
        existingClaim: stash-cache
        subPath: blobs
        mountPath: /blobs
      data:
        enabled: true
        type: nfs
        mountPath: /medias
        path: ${NFS_MEDIAS_PATH}
        server: ${NFS_SERVER}
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                STASH_CONFIG_FILE: /config/config.yml
                STASH_STASH: /medias/adult
                HOME: /config
                USER: stash
    service:
      main:
        type: LoadBalancer
    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        hostnames:
          - "stash.${DOMAIN_0}"
        integrations:
          envoy:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Arrs
            name: "Stash"
            widget:
              enabled: false
