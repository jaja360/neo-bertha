apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 34.2.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      backblaze:
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    cnpg:
      main:
        mode: recovery
        password: ${CNPG_PASSWD}
        hibernate: false
        cluster:
          instances: ${NUMBER_OF_NODES}
          singleNode: ${SINGLE_NODE}
        backups:
          enabled: true
          credentials: backblaze
          retentionPolicy: 7d
        recovery:
          credentials: backblaze
    redis:
      password: ${CNPG_PASSWD}
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  ALLOW_EMPTY_PASSWORD: "no"
                  VALKEY_PASSWORD: ${CNPG_PASSWD}
    service:
      main:
        type: LoadBalancer
    ingress:
      main:
        enabled: true
        hosts:
          - host: "auth.${DOMAIN_0}"
            paths:
            - path: /
              pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Admin
            name: "Authelia"
            widget:
              enabled: false
    authelia:
      theme: auto
      totp:
        issuer: Authelia
        period: 30
        skew: 1
      duo_api:
        disable: false
        hostname: "${DUO_HOSTNAME}"
        integration_key: "${DUO_INTEG_KEY}"
        secret_key: "${DUO_API_KEY}"
        enable_self_enrollment: false
      authentication_backend:
        ldap:
          address: ldap://lldap-ldap.lldap.svc.cluster.local:3890
          implementation: lldap
          base_dn: ${LDAP_BASE_DN}
          user: uid=admin,ou=people,${LDAP_BASE_DN}
          password: ${LDAP_ADMIN_PASSWD}
      session:
        cookies:
          - domain: ${DOMAIN_0}
            authelia_url: https://auth.${DOMAIN_0}
            inactivity: '5m'
            expiration: '1h'
            remember_me: '1M'
      notifier:
        smtp:
          address: submission://smtp.gmail.com:587
          username: ${EMAIL_GMAIL}
          password: ${EMAIL_GMAIL_PASSWD}
          sender: ${EMAIL_GMAIL}
          startup_check_address: test@${DOMAIN_0}
          timeout: 20s
          tls:
            server_name: smtp.gmail.com
            minimum_version: TLS1.2
            skip_verify: false
      access_control:
        default_policy: deny
        rules:
        - domain:
          - qbit.${DOMAIN_0}
          policy: two_factor
          subject:
            - group:all_access
        - domain:
          - sonarr.${DOMAIN_0}
          - radarr.${DOMAIN_0}
          - lidarr.${DOMAIN_0}
          - prowlarr.${DOMAIN_0}
          - whisparr.${DOMAIN_0}
          - bazarr.${DOMAIN_0}
          - sabnzbd.${DOMAIN_0}
          - tracearr.${DOMAIN_0}
          policy: bypass
          resources:
            - ^/api([/?].*)?$
        - domain:
          - nextcloud.${DOMAIN_0}
          - calibreweb.${DOMAIN_0}
          policy: two_factor
          subject:
            - group:nextcloud_users
        - domain:
          - "*.${DOMAIN_0}"
          policy: two_factor
          subject:
            - group:all_access
    oidcClients:
      oleafly:
        name: Oleafly
        secretHash: ${AUTHELIA_OLEAFLY_CLIENT_SECRET_HASH}
        redirectURIs:
          - https://oleafly.${DOMAIN_0}/auth/callback/authelia
        tokenEndpointAuthMethod: client_secret_basic
    secret:
      authelia-configfile:
        enabled: true
        data:
          configuration.yaml: |
            {{- $.Values.authelia | toYaml | nindent 2 }}
            identity_providers:
              oidc:
                hmac_secret: ${AUTHELIA_OIDC_HMAC_SECRET}
                jwks:
                  - algorithm: RS256
                    use: sig
                    key: {{ "${AUTHELIA_OIDC_JWKS_KEY_B64}" | b64dec | toJson }}
                claims_policies:
                  default:
                    id_token:
                      - email
                      - email_verified
                      - preferred_username
                      - name
                      - picture
                clients:
            {{- range $id, $c := .Values.oidcClients }}
            {{- if not $c.secretHash }}
            {{- fail (printf "oidcClients.%s.secretHash is empty" $id) }}
            {{- end }}
                  - client_id: {{ $id }}
                    client_name: {{ $c.name | default $id | quote }}
                    client_secret: {{ $c.secretHash | quote }}
                    claims_policy: {{ $c.claimsPolicy | default "default" }}
                    public: false
                    authorization_policy: {{ $c.authorizationPolicy | default "two_factor" }}
                    redirect_uris:
            {{- range $c.redirectURIs }}
                      - {{ . | quote }}
            {{- end }}
                    scopes:
            {{- range $c.scopes | default (list "openid" "profile" "email") }}
                      - {{ . }}
            {{- end }}
                    grant_types:
                      - authorization_code
                    response_types:
                      - code
                    token_endpoint_auth_method: {{ $c.tokenEndpointAuthMethod | default "client_secret_basic" }}
            {{- end }}
    workload:
      main:
        replicas: ${NUMBER_OF_NODES}
        podSpec:
          containers:
            main:
              env:
                AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
                AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
                AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
