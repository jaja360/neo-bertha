apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: envoy-auth-apps
  namespace: authelia
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: fileflows
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: firefox
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: homepage
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: libredb-studio
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: poznote
