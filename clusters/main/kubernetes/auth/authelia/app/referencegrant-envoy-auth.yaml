      kind: SecurityPolicy
      namespace: qbitmanage
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: qbittorrent
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: sabnzbd
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: slskd
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: vaultwarden
  to:
    - group: ""
      kind: Service
      name: authelia
