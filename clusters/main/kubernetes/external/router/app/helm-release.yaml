apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-service-router
  namespace: external-service
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 19.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    service:
      main:
        enabled: true
        type: ExternalIP
        externalIP: ${GATEWAY}
        ports:
          main:
            enabled: true
            port: 443
            protocol: https
    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        annotations:
          gethomepage.dev/external: "true"
          gethomepage.dev/ping: "${GATEWAY}"
          gethomepage.dev/statusStyle: "dot"
        hostnames:
          - "router.${DOMAIN_0}"
        rules:
          - backendRefs:
              - group: gateway.envoyproxy.io
                kind: Backend
                name: unifi-router
        integrations:
          envoy:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
            backendTrafficPolicy:
              useClientProtocol: true
              httpUpgrade:
                - type: websocket
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Admin
            icon: "unifi.png"
            description: "WAN, LAN and WLAN status"
            name: "UniFi Gateway"
            widget:
              enabled: true
              type: unifi
              custom:
                key: "${UNIFI_APIKEY}"
