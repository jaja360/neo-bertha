apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-service-zen5
  namespace: external-service
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 19.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    service:
      main:
        enabled: true
        type: ExternalIP
        externalIP: ${JETKVM_ZEN5_IP}
        ports:
          main:
            enabled: true
            port: 80
            protocol: http
    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        listenerPort: 8443
        hostnames:
          - "zen5.${DOMAIN_0}"
        annotations:
          gethomepage.dev/external: "true"
          gethomepage.dev/ping: "${JETKVM_ZEN5_IP}"
          gethomepage.dev/statusStyle: "dot"
        integrations:
          envoy:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
            backendTrafficPolicy:
              timeout:
                http:
                  streamIdleTimeout: 3600s
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Admin
            icon: "https://raw.githubusercontent.com/jetkvm/kvm/refs/heads/dev/ui/public/favicon.png"
            description: "Next-gen open-source KVM over IP"
            name: "JetKVM - Zen5"
            widget:
              enabled: false
