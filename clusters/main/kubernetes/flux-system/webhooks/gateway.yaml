apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: flux-webhook
  namespace: flux-system
  annotations:
    cert-manager.io/cluster-issuer: domain-0-le-prod
    cert-manager.io/private-key-rotation-policy: Always
spec:
  parentRef:
    name: envoy-internal
    namespace: envoy-gateway
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: flux-webhook.${DOMAIN_0}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: flux-webhook-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-receiver
  namespace: flux-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: flux-webhook
      sectionName: https
  hostnames:
    - flux-webhook.${DOMAIN_0}
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80
