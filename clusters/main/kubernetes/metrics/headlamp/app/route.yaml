apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    cert-manager.io/cluster-issuer: domain-0-le-prod
    cert-manager.io/private-key-rotation-policy: Always
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: envoy-gateway
  listeners:
    - name: headlamp
      hostname: headlamp.${DOMAIN_0}
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: headlamp-gw-tls-0
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://headlamp.${DOMAIN_0}"
    gethomepage.dev/description: "View and manage the Kubernetes cluster"
    gethomepage.dev/group: Admin
    gethomepage.dev/icon: https://raw.githubusercontent.com/headlamp-k8s/headlamp/d8260857d16d28daedfbe8d6f53e1c165a4e4b05/frontend/public/android-chrome-512x512.png
    gethomepage.dev/name: "Headlamp"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: headlamp
      sectionName: headlamp
  hostnames:
    - headlamp.${DOMAIN_0}
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: headlamp
  namespace: headlamp
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: headlamp
  extAuth:
    headersToExtAuth:
      - accept
      - sec-fetch-mode
      - sec-fetch-dest
      - x-requested-with
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - name: authelia
          namespace: authelia
          port: 9091
      path: /api/authz/ext-authz/
