apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
  namespace: tracearr
spec:
  interval: 15m
  chart:
    spec:
      chart: tracearr
      version: 9.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      backblaze:
        type: s3
        accessKey: "${BACKBLAZE_ID}"
        bucket: "${BACKBLAZE_BUCKET}"
        encrKey: "${BACKBLAZE_ENCR_KEY}"
        secretKey: "${BACKBLAZE_KEY}"
        url: "${BACKBLAZE_URL}"
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: tracearr
          postgresqlDatabase: tracearr
          password: ${CNPG_PASSWD}
        operator:
          pgVersion: 16
          mode: recovery
          cluster:
            imageName: ghcr.io/jaja360/cnpg-postgresql-timescale:16.15-ts2.30.1
            instances: ${NUMBER_OF_NODES}
            singleNode: ${SINGLE_NODE}
            storage:
              size: 100Gi
            walStorage:
              size: 200Gi
            preloadLibraries:
              - timescaledb
            postgresql:
              max_locks_per_transaction: "256"
          backups:
            enabled: true
            credentials: backblaze
            retentionPolicy: 7d
          recovery:
            credentials: backblaze
    service:
      main:
        type: LoadBalancer
    secret:
      env-secrets:
        enabled: true
        data:
          JWT_SECRET: "${TRACEARR_JWT_SECRET}"
          COOKIE_SECRET: "${TRACEARR_COOKIE_SECRET}"
    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        listenerPort: 8443
        hostnames:
          - "tracearr.${DOMAIN_0}"
        integrations:
          envoy:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            group: Misc
            name: tracearr
            widget:
              enabled: true
              custom:
                key: ${TRACEARR_APIKEY}
