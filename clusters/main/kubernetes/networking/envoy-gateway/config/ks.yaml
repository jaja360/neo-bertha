apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  # The Gateway API CRDs and the Envoy Gateway controller are installed by the
  # `envoy-gateway` Kustomization. The wildcard TLS Secret referenced by the
  # Gateway is produced by `clusterissuer`.
  dependsOn:
    - name: envoy-gateway
    - name: clusterissuer
  interval: 10m
  path: clusters/main/kubernetes/networking/envoy-gateway/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: cluster
