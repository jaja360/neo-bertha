apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/system/envoy-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: envoy-gateway
    - name: clusterissuer
  path: clusters/main/kubernetes/system/envoy-gateway/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: cluster
