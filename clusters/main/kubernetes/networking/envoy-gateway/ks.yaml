apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/networking/envoy-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  # Wait for the HelmRelease (and its CRDs) to be installed before the
  # sibling `envoy-gateway-config` Kustomization applies Gateway API objects.
  wait: true

