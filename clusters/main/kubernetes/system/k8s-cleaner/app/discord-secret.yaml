---
apiVersion: v1
kind: Secret
metadata:
  name: discord
  namespace: k8s-cleaner
type: Opaque
stringData:
  DISCORD_TOKEN: "${DISCORD_TOKEN}"
  # Channel IDs are not secret. Kept as a quoted literal on purpose: a Flux
  # ${VAR} substitution injects the bare digits into a plain YAML scalar, which
  # kustomize then types as an integer (Secret stringData requires a string).
  DISCORD_CHANNEL_ID: "1035694886617358300"
