# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-cleaner
  namespace: k8s-cleaner
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-cleaner
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: k8s-cleaner
        namespace: flux-system
      interval: 2h
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      install: true
    rbac:
      create: true
    web:
      enabled: true
      readOnly: true
      port: 9080
      ingress:
        enabled: false
