apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-queue
  namespace: volsync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volsync-queue
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - volsync.backube
    resources:
      - replicationsources
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volsync-queue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volsync-queue
subjects:
  - kind: ServiceAccount
    name: volsync-queue
    namespace: volsync
