# Control plane specific machine config patches.
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - system-upgrade
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
  proxy:
    extraArgs:
      metrics-bind-address: 0.0.0.0:10249
  apiServer:
    extraArgs:
      enable-aggregator-routing: "true"
    admissionControl:
      - name: PodSecurity
        configuration:
          exemptions:
            namespaces:
              - metallb
              - metallb-config
              - topolvm-system
              - longhorn-system
              - kyverno
              - system-upgrade
              - openebs
              - snapshot-controller
              - volsync
              - flux-system
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
config:
  profiles:
    - pluginConfig:
        - args:
            defaultConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
            defaultingType: List
          name: PodTopologySpread
      plugins:
        score:
          disabled:
            - name: ImageLocality
      schedulerName: default-scheduler
